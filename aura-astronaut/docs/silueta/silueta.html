const W = 300, H = 520;                 // size of each frame
const PERIOD_S = 16;                    // one full turn, as in the app
const FPS = 15, FRAMES = PERIOD_S * FPS;
const BPM = 67.5;                       // 18 beats per turn: the GIF loops seamlessly
const CAMERA_DISTANCE = 4;
const INNER_ALPHAS = [0, 0.025, 0.06, 0.12];
const CYAN = [92, 225, 240], HEART = [255, 158, 196];
const HEART_Y = 0.725;

const bytes = Uint8Array.from(atob(BODY_B64), c => c.charCodeAt(0));
const dv = new DataView(bytes.buffer);
const nv = dv.getInt32(0, true), nt = dv.getInt32(4, true);
const xyz = new Float32Array(nv * 3);
for (let i = 0; i < nv * 3; i++) xyz[i] = dv.getFloat32(8 + i * 4, true);
const tri = new Uint16Array(nt * 3);
for (let i = 0; i < nt * 3; i++) tri[i] = dv.getUint16(8 + nv * 12 + i * 2, true);

// Edges with their two neighboring faces (−1 if it is a border)
const faces = new Map();
for (let t = 0; t < nt; t++) for (let k = 0; k < 3; k++) {
  const a = tri[t * 3 + k], b = tri[t * 3 + (k + 1) % 3];
  const key = Math.min(a, b) * 65536 + Math.max(a, b);
  const f = faces.get(key);
  if (!f) faces.set(key, [Math.min(a, b), Math.max(a, b), t, -1]);
  else if (f[2] !== t && f[3] === -1) f[3] = t;
}
const edges = [...faces.values()];

// Heart: chest, slightly left of the sternum (like BodyRig)
const meanZ = filter => { let s = 0, c = 0; for (let i = 0; i < nv; i++) if (filter(i)) { s += xyz[i * 3 + 2]; c++; } return c ? s / c : 0; };
const ankle = meanZ(i => xyz[i * 3 + 1] >= 0.05 && xyz[i * 3 + 1] <= 0.08);
const foot = meanZ(i => xyz[i * 3 + 1] < 0.025);
const front = foot >= ankle ? 1 : -1;
const chestZ = meanZ(i => Math.abs(xyz[i * 3 + 1] - HEART_Y) <= 0.02 && Math.abs(xyz[i * 3]) < 0.1);
const heart = [0.014 * front, HEART_Y, chestZ + 0.012 * front];

const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function drawFrame(ctx, ox, oy, angle, phase) {
  const scale = H * 0.86, originX = ox + W / 2, groundY = oy + H * 0.97;
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const sx = new Float32Array(nv), sy = new Float32Array(nv);
  for (let i = 0; i < nv; i++) {
    const x = xyz[i * 3], y = xyz[i * 3 + 1], z = xyz[i * 3 + 2];
    const xr = x * ca + z * sa, zr = -x * sa + z * ca;
    const p = CAMERA_DISTANCE / (CAMERA_DISTANCE - zr);
    sx[i] = originX + xr * scale * p;
    sy[i] = groundY - (y - 0.5) * scale * p - 0.5 * scale;
  }
  const facing = new Float32Array(nt);
  for (let t = 0; t < nt; t++) {
    const a = tri[t * 3], b = tri[t * 3 + 1], c = tri[t * 3 + 2];
    const ux = xyz[b*3]-xyz[a*3], uy = xyz[b*3+1]-xyz[a*3+1], uz = xyz[b*3+2]-xyz[a*3+2];
    const vx = xyz[c*3]-xyz[a*3], vy = xyz[c*3+1]-xyz[a*3+1], vz = xyz[c*3+2]-xyz[a*3+2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    facing[t] = (-nx * sa + nz * ca) / len;
  }
  const outline = new Path2D(), inner = INNER_ALPHAS.map(() => new Path2D());
  for (const [a, b, f1, f2] of edges) {
    const d1 = facing[f1], d2 = f2 >= 0 ? facing[f2] : -d1;
    const silhouette = (d1 > 0) !== (d2 > 0);
    if (!silhouette && d1 <= 0) continue;
    let path = outline;
    if (!silhouette) {
      const rim = 1 - Math.min(1, (Math.abs(d1) + Math.abs(d2)) / 2);
      path = inner[Math.min(INNER_ALPHAS.length - 1, Math.floor(rim * INNER_ALPHAS.length))];
    }
    path.moveTo(sx[a], sy[a]); path.lineTo(sx[b], sy[b]);
  }

  // Heart and aura, behind the mesh
  const hx = heart[0] * ca + heart[2] * sa, hz = -heart[0] * sa + heart[2] * ca;
  const hp = CAMERA_DISTANCE / (CAMERA_DISTANCE - hz);
  const cx = originX + hx * scale * hp, cy = groundY - (heart[1] - 0.5) * scale * hp - 0.5 * scale;
  const beat = Math.exp(-phase * 9) + 0.45 * Math.exp(-((phase - 0.18) ** 2) / 0.002);
  const core = 0.022 * scale * (1 + 0.45 * beat);
  for (let k = 0; k < 2; k++) {
    const t = (phase + k * 0.5) % 1;
    const r = core + (0.5 * scale - core) * t;
    const al = 0.45 * (1 - t) * (1 - t) * (k === 0 ? 1 : 0.6);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, rgba(HEART, 0)); g.addColorStop(0.72, rgba(HEART, al * 0.35));
    g.addColorStop(0.92, rgba(HEART, al)); g.addColorStop(1, rgba(HEART, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill();
  }
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 3.2);
  g.addColorStop(0, rgba(HEART, 0.55 + 0.35 * beat)); g.addColorStop(0.45, rgba(HEART, 0.25 * (0.5 + beat)));
  g.addColorStop(1, rgba(HEART, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, core * 3.2, 0, 2 * Math.PI); ctx.fill();

  ctx.lineWidth = 1;
  inner.forEach((p, i) => { if (INNER_ALPHAS[i] > 0) { ctx.strokeStyle = rgba(CYAN, INNER_ALPHAS[i]); ctx.stroke(p); } });
  ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(CYAN, 0.6); ctx.stroke(outline);
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(CYAN, 0.14);
  ctx.beginPath(); ctx.ellipse(originX, groundY, 0.22 * scale, 0.03 * scale, 0, 0, 2 * Math.PI); ctx.stroke();
}

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const TRANSPARENT = location.search.includes("transparent");
const BG = TRANSPARENT ? null : "#060d12";
if (TRANSPARENT) document.documentElement.style.background = document.body.style.background = "transparent";
const clear = (x, y, w, h) => { if (BG) { ctx.fillStyle = BG; ctx.fillRect(x, y, w, h); } else ctx.clearRect(x, y, w, h); };
if (location.search.includes("sheet")) {
  const COLS = 16, ROWS = Math.ceil(FRAMES / COLS);
  canvas.width = COLS * W; canvas.height = ROWS * H;
  clear(0, 0, canvas.width, canvas.height);
  for (let f = 0; f < FRAMES; f++) {
    const time = f / FPS;
    drawFrame(ctx, (f % COLS) * W, Math.floor(f / COLS) * H, 2 * Math.PI * time / PERIOD_S, (time * BPM / 60) % 1);
  }
} else {
  canvas.width = W; canvas.height = H;
  const t0 = performance.now();
  (function loop(now) {
    const time = (now - t0) / 1000;
    clear(0, 0, W, H);
    drawFrame(ctx, 0, 0, 2 * Math.PI * time / PERIOD_S, (time * BPM / 60) % 1);
    requestAnimationFrame(loop);
  })(t0);
}
